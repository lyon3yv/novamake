<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dashboard — Discord Block Builder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;margin:0;padding:20px}
    header{display:flex;align-items:center;gap:12px}
    img.logo{width:48px}
    h1{margin:0}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:20px;margin-top:18px}
    .card{background:white;padding:16px;border-radius:10px;box-shadow:0 6px 18px rgba(32,33,36,.06)}
    button{padding:8px 12px;border-radius:8px;border:none;background:#6C5CE7;color:white}
    input, textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #e6e9ef}
    .project{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eef2f7}
    .muted{color:#6b7280;font-size:13px}
  </style>
</head>
<body>
  <header>
    <img src="nova (5).png" class="logo">
    <div>
      <h1>Dashboard</h1>
      <div class="muted">Tus proyectos y bots</div>
    </div>
    <div style="margin-left:auto"><button id="logoutBtn">Cerrar sesión</button></div>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h3>Proyectos</h3>
        <div id="projectsList"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>Nuevo / Editar</h3>
        <input id="projId" placeholder="ID (opcional)">
        <input id="projName" placeholder="Nombre">
        <textarea id="projCode" rows="12" placeholder="Pega el código del bot aquí"></textarea>
        <button id="saveProj">Guardar</button>
      </div>

      <div class="card" style="margin-top:12px">
        <h3>Estado de bots</h3>
        <pre id="botsStatus">Cargando...</pre>
      </div>
    </div>
  </div>

<script src="dashboard.js"></script>
</body>
</html>
