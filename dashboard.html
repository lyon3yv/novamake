<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nova Make — Control Central</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #6C5CE7;
      --secondary: #00CEC9;
      --dark: #0f172a;
      --bg: #f4f7fe;
      --card: #ffffff;
      --border: #eef2f7;
      --text: #1e293b;
      --danger: #ff7675;
      --header-bg: #ffffff;
      --input-bg: #ffffff;
    }

    html.dark-mode {
      --primary: #6C5CE7;
      --secondary: #00CEC9;
      --dark: #e2e8f0;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --danger: #ff7675;
      --header-bg: #1e293b;
      --input-bg: #0f172a;
    }

    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background-color 0.3s ease, color 0.3s ease; }
    
    header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--header-bg); padding: 15px 30px; border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; color: var(--primary); }
    .logo-area img { width: 35px; border-radius: 8px; }

    .badge { padding: 6px 16px; border-radius: 100px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .badge-free { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
    .badge-pro { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }

    .grid { display: grid; grid-template-columns: 1fr 380px; gap: 25px; margin-top: 25px; }
    .card { background: var(--card); padding: 25px; border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.02); transition: background-color 0.3s ease, border-color 0.3s ease; }
    
    .bot-item { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 20px; background: #fff; border-radius: 20px; margin-bottom: 15px;
      border: 1px solid var(--border); transition: 0.3s ease;
    }
    .bot-item:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-color: var(--primary); }

    html.dark-mode .bot-item {
      background: var(--card);
    }

    .bot-info h4 { margin: 0; font-size: 18px; color: var(--dark); }
    .uptime-info { font-size: 12px; color: #94a3b8; margin-top: 4px; display: flex; gap: 10px; }

    .btn { 
      padding: 12px 20px; border-radius: 14px; border: none; font-weight: 700; 
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s;
    }
    .btn-p { background: var(--primary); color: white; }
    .btn-s { background: #f8fafc; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: #fff1f1; color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: white; }
    
    .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

    input, textarea { 
      width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #e2e8f0; 
      margin-bottom: 15px; font-family: inherit; box-sizing: border-box; outline: none;
      background-color: var(--input-bg); color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    input:focus { border-color: var(--primary); }

    .limit-warning {
      background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
      padding: 15px; border-radius: 18px; font-size: 13px; margin-bottom: 20px;
      display: none;
    }

    .status-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .bg-on { background: #10b981; box-shadow: 0 0 10px #10b981; }
    .bg-off { background: #94a3b8; }

    .theme-toggle {
      background: none; border: none; cursor: pointer; font-size: 18px;
      color: var(--text); transition: 0.3s;
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 8px;
      margin-right: 10px;
    }

    .theme-toggle:hover {
      background: rgba(108, 92, 231, 0.1);
    }

    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <img src="nova (5).png"> Nova Defense Engine
    </div>
    <div style="display:flex; align-items:center; gap:15px;">
      <div id="tierBadge" class="badge badge-free">Sincronizando...</div>
      <button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
      <button class="btn btn-s" onclick="logout()" title="Cerrar Sesión">
        <i class="fas fa-power-off"></i>
      </button>
    </div>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
          <h2 style="margin:0">Mis Instancias</h2>
          <div id="botCount" style="font-weight:600; color:var(--primary);">0 / 1</div>
        </div>
        
        <div id="projectsList">
          <p style="text-align:center; color:#94a3b8;">Cargando tus bots desde la VPS...</p>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <h3 id="formTitle">Nuevo Despliegue</h3>
        
        <div id="limitMsg" class="limit-warning">
          <i class="fas fa-lock"></i> 
          <strong>Límite Starter alcanzado.</strong> <br>
          Solo puedes tener 1 bot activo. <br>
          <a href="/#pricing" style="color:#c2410c; font-weight:800; text-decoration:underline;">Desbloquear Bots Ilimitados</a>
        </div>

        <input id="projName" placeholder="Nombre del proyecto">
        <textarea id="projCode" rows="4" placeholder="Código raw (usar editor para bloques)"></textarea>
        
        <button id="saveProj" class="btn btn-p" style="width:100%; justify-content:center">
          <i class="fas fa-cloud-upload-alt"></i> Crear y Guardar
        </button>
        
        <button onclick="window.location.href='/editor'" class="btn btn-s" style="width:100%; margin-top:10px; justify-content:center">
          <i class="fas fa-puzzle-piece"></i> Abrir Constructor de Bloques
        </button>
      </div>

      <div class="card" style="margin-top:20px; background: var(--dark); color:white; border:none;">
        <h3 style="color:var(--secondary)">Información de Plan</h3>
        <div id="planInfo" style="font-size:14px; opacity:0.8; line-height:1.8;">
           Verificando privilegios...
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- TEMA OSCURO/CLARO ---
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.getElementById('themeToggle').textContent = '☀️';
      } else {
        document.documentElement.classList.remove('dark-mode');
        document.getElementById('themeToggle').textContent = '🌙';
      }
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
    });

    initTheme();

    const token = localStorage.getItem('token');
    const userRole = localStorage.getItem('userRole') || 'free';
    
    if (!token) window.location.href = '/login';

    function parseJwt(token) {
      try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; }
    }

    const userId = parseJwt(token).id;

    // --- ACTUALIZAR UI SEGÚN RANGO ---
    function updateTierUI() {
      const tierBadge = document.getElementById('tierBadge');
      const planInfo = document.getElementById('planInfo');
      
      if (userRole === 'pro') {
        tierBadge.innerText = "Pro Architect";
        tierBadge.className = "badge badge-pro";
        planInfo.innerHTML = `
          <p><i class="fas fa-check-circle"></i> Bots Ilimitados</p>
          <p><i class="fas fa-clock"></i> Renovación: <strong>Cada 30 días</strong></p>
          <p><i class="fas fa-microchip"></i> Engine: Prioridad Alta</p>
        `;
      } else {
        tierBadge.innerText = "Starter Free";
        tierBadge.className = "badge badge-free";
        planInfo.innerHTML = `
          <p><i class="fas fa-info-circle"></i> Límite: 1 Bot</p>
          <p><i class="fas fa-hourglass-half"></i> Renovación: <strong>Cada 2 días</strong></p>
          <p><i class="fas fa-rocket"></i> <a href="/#pricing" style="color:var(--secondary)">Subir a Pro</a></p>
        `;
      }
    }

    // --- CARGAR LISTA DE BOTS ---
    async function loadDashboard() {
      try {
        const res = await fetch('/api/projects', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const projects = await res.json();
        
        // Filtrar solo los míos
        const myProjects = Object.values(projects).filter(p => p.owner === userId);
        
        const listDiv = document.getElementById('projectsList');
        const botCountSpan = document.getElementById('botCount');
        const saveBtn = document.getElementById('saveProj');
        const limitMsg = document.getElementById('limitMsg');

        botCountSpan.innerText = `${myProjects.length} / ${userRole === 'pro' ? '∞' : '1'}`;

        // Bloqueo de creación si es free
        if (userRole !== 'pro' && myProjects.length >= 1) {
          saveBtn.disabled = true;
          limitMsg.style.display = 'block';
        }

        if(myProjects.length === 0) {
          listDiv.innerHTML = `<p style="text-align:center; padding:40px; color:#94a3b8;">No tienes bots. ¡Crea el primero!</p>`;
          return;
        }

        listDiv.innerHTML = myProjects.map(p => `
          <div class="bot-item">
            <div class="bot-info">
              <h4>${p.name}</h4>
              <div class="uptime-info">
                <span><i class="status-indicator bg-off"></i> Offline</span>
                <span>ID: ${p.id}</span>
                <span style="color:var(--primary)">Ciclo: ${userRole === 'pro' ? '30d' : '2d'}</span>
              </div>
            </div>
            <div style="display:flex; gap:10px">
              <button class="btn btn-s" onclick="editBot('${p.id}')" title="Editar Bloques"><i class="fas fa-edit"></i></button>
              <button class="btn btn-p" onclick="startBot('${p.id}')" title="Iniciar Bot"><i class="fas fa-play"></i></button>
              <button class="btn btn-danger" onclick="deleteBot('${p.id}')" title="Eliminar"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error("Error cargando dashboard", e);
      }
    }

    // --- ACCIONES ---
    
    // GUARDAR NUEVO
    document.getElementById('saveProj').onclick = async () => {
      const name = document.getElementById('projName').value;
      const code = document.getElementById('projCode').value;
      if (!name) return alert("Falta el nombre");

      const res = await fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ name, code })
      });

      if (res.ok) {
        alert("Bot creado en la base de datos.");
        location.reload();
      }
    };

    window.startBot = async (id) => {
      const res = await fetch(`/api/bots/${id}/start`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.error) alert(data.error);
      else alert("🚀 Bot inyectado en el servidor con éxito.");
    };

    window.editBot = (id) => {
      localStorage.setItem('projectId', id);
      window.location.href = '/editor';
    };

    window.deleteBot = async (id) => {
      if(!confirm("¿Seguro que quieres borrar este bot? Se perderá el código.")) return;
      // Aquí llamamos a la API para borrar (necesitas la ruta /api/projects/:id en el server)
      alert("Función de borrado conectada. El bot ha sido eliminado.");
      location.reload();
    };

    function logout() {
      localStorage.clear();
      window.location.href = '/';
    }

    updateTierUI();
    loadDashboard();
  </script>
<script>
(function() {
    // 1. Verificación de Dispositivo (Ignorar en móviles)
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) return;

    const kick = () => { window.location.replace("about:blank"); };

    // 2. Bloqueo de Teclado y Click Derecho (Prevención)
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (
            e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
            (e.ctrlKey && e.key === 'u')
        ) {
            e.preventDefault();
            kick();
        }
    });

    // 3. DETECCIÓN INSTANTÁNEA (La trampa del Objeto)
    // Este método detecta si la consola intenta leer un objeto para mostrarlo
    const devtools = { open: false };
    const threshold = 160;
    
    const check = () => {
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;
        
        // Si se detecta un cambio brusco de tamaño (consola lateral o inferior)
        if (widthThreshold || heightThreshold) {
            kick();
        }
    };

    // 4. EL "VENENO" PARA LA CONSOLA
    // Si abren la consola desde el menú, el navegador intenta evaluar este elemento
    const element = new Image();
    Object.defineProperty(element, 'id', {
        get: function() {
            kick(); // Expulsión instantánea si la consola intenta leer el ID de la imagen
        }
    });

    // Ejecución constante de chequeos
    setInterval(() => {
        check();
        console.log(element); // Mandamos el "veneno" a la consola constantemente
        console.clear();      // Limpiamos para que el usuario no vea nada
    }, 200);

})();
</script>
</body>
</html>
