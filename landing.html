<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova Make — Build Discord Bots Visually</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Outfit',sans-serif;margin:0;background:linear-gradient(180deg,#f7f9ff,#eef6ff);color:#1f2937}
    .hero{max-width:980px;margin:80px auto;padding:40px;background:white;border-radius:16px;box-shadow:0 20px 40px rgba(16,24,40,.08);display:flex;gap:24px;align-items:center}
    .brand{display:flex;flex-direction:column}
    .logo{width:88px;height:88px;border-radius:18px;background:linear-gradient(135deg,#6C5CE7,#00CEC9);display:grid;place-items:center;color:white;font-size:36px}
    h1{margin:0;font-size:28px}
    p{color:#475569}
    .cta{margin-top:18px}
    .btn{padding:12px 18px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
    .primary{background:linear-gradient(135deg,#6C5CE7,#a29bfe);color:white}
    .secondary{background:white;border:1px solid #e6e9ef;color:#334155}
    .links{margin-left:auto}
  </style>
</head>
<body>
  <div class="hero">
    <div class="brand">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="logo">🚀</div>
        <div>
          <h1>Nova Make</h1>
          <p>Construye, despliega y gestiona bots de Discord sin escribir código.</p>
        </div>
      </div>
      <div class="cta">
        <button class="btn primary" onclick="location.href='/login.html'">Iniciar sesión</button>
        <button class="btn secondary" onclick="location.href='/editor'" style="margin-left:12px">Abrir editor</button>
      </div>
    </div>
    <div class="links">
      <img src="nova (5).png" style="width:240px;opacity:.95;border-radius:14px;">
    </div>
  </div>
</body>
</html>
