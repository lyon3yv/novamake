<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Discord Block Builder — Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#f5f7fb; display:flex; align-items:center; justify-content:center; height:100vh; margin:0 }
    .card { background:white; padding:24px; border-radius:12px; box-shadow:0 6px 24px rgba(32,33,36,.12); width:360px }
    img.logo { width:72px; display:block; margin:0 auto 12px }
    h1 { font-size:18px; text-align:center; margin:0 0 8px }
    .row { margin:8px 0 }
    input { width:100%; padding:10px; border-radius:8px; border:1px solid #e6e9ef }
    button { width:100%; padding:10px; border-radius:8px; border:none; background:#6C5CE7; color:white; font-weight:600; margin-top:12px }
    .muted { font-size:13px; color:#6b7280; text-align:center; margin-top:8px }
  </style>
</head>
<body>
  <div class="card">
    <img src="nova (5).png" class="logo" alt="logo">
    <h1>Discord Block Builder</h1>
    <div class="row"><input id="userId" placeholder="Usuario (ej: juan)"/></div>
    <div class="row"><input id="password" type="password" placeholder="Contraseña"/></div>
    <button id="loginBtn">Iniciar sesión</button>
    <button id="registerBtn" style="background:#00cec9;margin-top:8px">Registrar</button>
    <div class="muted">¿No tienes cuenta? Regístrate arriba.</div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
